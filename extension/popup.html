<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Trinetra Provenance</title>
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
    }
    h2 {
      font-size: 16px;
      margin-top: 0;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    p { font-size: 13px; color: #94a3b8; line-height: 1.4; }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      background: #0284c7;
      color: white;
      text-align: center;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      margin-top: 10px;
      text-decoration: none;
    }
    .btn:hover { background: #0369a1; }
    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      background: #1e293b;
      border-radius: 4px;
      font-size: 11px;
      color: #22c55e;
      margin-bottom: 12px;
    }
    .file-input-wrapper {
      margin-top: 12px;
    }
    input[type="file"] {
      width: 100%;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <h2>👁️ Trinetra</h2>
  <div class="status-badge">● Provenance Engine Online</div>
  <p>Right-click any image in your browser or WhatsApp Web and choose <strong>"Verify Image with Trinetra"</strong>.</p>
  
  <div class="file-input-wrapper">
    <label style="font-size: 12px; font-weight: 600;">Or upload an image directly:</label>
    <input type="file" id="fileUpload" accept="image/*" style="margin-top: 6px;" />
  </div>

  <button class="btn" id="analyzeBtn" style="display:none;">Verify Image</button>
  <div id="resultArea" style="margin-top: 12px; font-size: 12px;"></div>

  <script src="popup.js"></script>
</body>
</html>
